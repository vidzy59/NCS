# === SETUP ===
cd /workspaces/NCS

# Pastikan gradlew executable
chmod +x ./gradlew

# Set Java 21 (sudah default di Codespace ubuntu-latest)
export JAVA_HOME=/usr/lib/jvm/temurin-21-jdk
export PATH=$JAVA_HOME/bin:$PATH

# Set Gradle opts untuk memory
export GRADLE_OPTS="-Xmx4g -Dfile.encoding=UTF-8"
export _JAVA_OPTIONS="-Xmx4g -Dfile.encoding=UTF-8"

# === BUILD ===
./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"

# === CEK HASIL ===
ls -la app/build/outputs/apk/debug/app-debug.apk
